name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest

  visualizer:
    name: visualizer (bun test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/sssf/apps/visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run tests
        # 5000ms default is tight for a cold runner (status.test.ts flaked at
        # 5044ms once) — the tests themselves take tens of ms.
        run: bun test --timeout 15000

  site:
    name: site (astro build + impeccable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build the static site
        run: npm run build
      - name: Impeccable design check
        run: npx --yes impeccable detect dist

  # Branch protection requires a status check named "CI" — GitHub names check
  # runs after the WORKFLOW when there is one job, but after each JOB when
  # there are several. This aggregate job (name = the required check) reports
  # "CI" and gates on both suites, so merges stop being blocked by a check
  # that never appears.
  aggregate:
    name: CI
    runs-on: ubuntu-latest
    needs: [python, visualizer, site]
    steps:
      - run: echo "python (pytest) + visualizer (bun test) + site (astro + impeccable) green"
