[project]
name = "sssf"
version = "1.0.0"
description = "Super Simple Software Factory — repeatable agents-plus-code workflows as a global CLI"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "python-dotenv", "pyyaml", "rich"]

[project.scripts]
sssf = "sssf.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sssf"]
# The asset trees are force-included below; keep hatchling from also
# auto-discovering them (that double-adds every file and fails the build).
exclude = [
  "src/sssf/apps/**",
  "src/sssf/templates/**",
  "src/sssf/docs/**",
  "src/sssf/SKILL.md",
]

# Non-python assets ship inside the package; init/viz read them via
# importlib.resources. force-include keeps them in the built wheel too.
[tool.hatch.build.targets.wheel.force-include]
"src/sssf/SKILL.md" = "sssf/SKILL.md"
"src/sssf/templates" = "sssf/templates"
"src/sssf/docs" = "sssf/docs"
"src/sssf/apps" = "sssf/apps"

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",   # function call in default arg (pydantic Field factories are idiomatic)
  "E501",   # line length is enforced by ruff-format, not lint
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
