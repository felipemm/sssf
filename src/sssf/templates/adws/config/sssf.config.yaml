# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
# v1 runs the Pi coding agent only; coding_agent: claude_code arrives in v2.
defaults:
  coding_agent: pi
  model: litellm/deepseek-v4-flash-official   # provider/id — a bare pattern is ambiguous across providers
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # pi extensions loaded into the harness (-e)
  # Roster-wide allowlist; any agent may override with its own list.
  # NOTE: --tools filters extension and custom tools too, not just builtins. An agent
  # whose harness_engineering extension registers a tool MUST name that tool in its own
  # tools list — otherwise the extension loads and its tool is silently filtered out.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  data_dir: adws/data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: adws/data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

# Deterministic quality commands — the kind="code" phases. Replace the
# placeholder argv with the project's real commands (`bun test`, `uv run
# pytest -q`, `bun x tsc --noEmit`, `npm run build`). Each check runs as a
# gate: pass/fail lands in gate_results and the status dashboard's quality KPI.
# - operation is lint | typecheck | build | security (e.g. ["snyk", "test"]).
# - argv is a LIST, never a shell string.
# - Call binaries by bare name (`bun`, `uv`); they resolve via the operator's
#   environment, never a hard-coded absolute path.
# - Delete the checks you don't need.
# - Full cookbook (schema, per-stack commands, budgets, sandbox, verification):
#   docs/quality-gates.md
quality:
  checks:
    - name: test
      area: backend
      operation: build
      argv: ["echo", "PLACEHOLDER test: wire quality.checks in adws/adw_sssf_config/sssf.config.yaml"]
      timeout_seconds: 600
    - name: lint
      area: backend
      operation: lint
      argv: ["echo", "PLACEHOLDER lint: wire quality.checks in adws/adw_sssf_config/sssf.config.yaml"]
      timeout_seconds: 120
    - name: typecheck
      area: backend
      operation: typecheck
      argv: ["echo", "PLACEHOLDER typecheck: wire quality.checks in adws/adw_sssf_config/sssf.config.yaml"]
      timeout_seconds: 120
    - name: build
      area: backend
      operation: build
      argv: ["echo", "PLACEHOLDER build: wire quality.checks in adws/adw_sssf_config/sssf.config.yaml"]
      timeout_seconds: 300
    # Shipped configured by default: the runner image provides both binaries
    # (snyk since PR #13, impeccable via the design-quality change). Projects
    # without a design surface or snyk setup remove the entry.
    #
    # `surface` is the per-project knob: the engine derives argv/requires
    # (impeccable detect <surface>) from it. Point it at the built design
    # surface (site/dist by default; src/public, web/, ... per project).
    # Re-run `sssf init --design-quality <surface>` to configure it.
    - name: design
      area: frontend
      operation: lint
      surface: site/dist
      timeout_seconds: 300
    - name: snyk
      area: backend
      operation: security
      # Auth is OAuth-ONLY: run `snyk auth` on the operator machine. Sandboxed
      # runs mount the host ~/.config (the CLI's OAuth session) read-only at
      # /tmp/.config, so the container's snyk uses the same session — no token
      # is ever forwarded (SNYK_TOKEN would outrank OAuth; stale/UAT tokens 401
      # against prod -> SNYK-0005).
      argv: ["snyk", "test"]
      timeout_seconds: 300

agents:
  - name: planner
    model: litellm/deepseek-v4-pro-official
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/data/prompt_engineering/planner/system.md
      user: adws/data/prompt_engineering/planner/user.md
    harness_engineering:
      - adws/data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes:                        # the plan is the only thing it may leave in the repo
      - adws/specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    color: "#22d3ee"
    # model: litellm/deepseek-v4-pro-official
    # thinking: high
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/data/prompt_engineering/builder/system.md
      user: adws/data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    color: "#fbbf24"
    # model: litellm/deepseek-v4-pro-official
    # thinking: high
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/data/prompt_engineering/scout/system.md
      user: adws/data/prompt_engineering/scout/user.md
    harness_engineering:
      - adws/data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    model: litellm/gpt-5.5
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/data/prompt_engineering/reviewer/system.md
      user: adws/data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: designer
    color: "#f59e0b"
    purpose: Run the impeccable design pass (audit, critique, polish, optimize) on the project's design surface and apply the fixes it reports.
    prompt_engineering:
      system: adws/data/prompt_engineering/designer/system.md
      user: adws/data/prompt_engineering/designer/user.md
    writes:
      - site/                     # the design surface; adjust in project configs
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: documenter
    model: litellm/gemini-2.5-flash
    thinking: high
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/data/prompt_engineering/documenter/system.md
      user: adws/data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - adws/kb/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit

# ── sandbox (all optional — defaults: enabled, image sssf-runner) ──────────
# review: how to launch the project's app AFTER the run so you can open it and
# validate the change. The container stays up after the run; the app's port is
# published on a RANDOM host port (see the run's Review panel in the viz).
# sandbox:
#   image: sssf-runner
#   review:
#     command: ["npm", "run", "dev", "--workspace=web"]   # argv list; cwd = the run worktree
#     container_port: 3000                                  # the app's port inside the container
#     instructions: "open the URL; sign in as Local Dev via the mock IDP"

# ── integration (all optional — defaults ON, target dev) ───────────────────
# Successful sandboxed runs merge back into an integration branch so you can
# test the change there before it reaches main. Branching and merging share
# ONE target: fresh runs branch from the branch below and successful runs
# merge back into it (created from main when it does not exist yet). The
# integration outcome lands as an `integration` event on the run's trace.
# integration:
#   enabled: true          # default on — false keeps the pure-main flow
#   branch: dev            # the shared target (set to main for the legacy
#                          #   straight-to-main auto-merge)
#   push: true             # repos with an origin: push the merged branch up
#   resolve: true          # merge conflicts are resolved by the coding agent
#                          #   (resolving-merge-conflicts skill) instead of
#                          #   being left for a manual merge
