name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest

  visualizer:
    name: visualizer (bun test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/sssf/apps/visualizer
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run tests
        run: bun test
